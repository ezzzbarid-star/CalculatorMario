<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Interaktif 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    /* Container Utama Karakter */
    .character-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Speech Bubble Hello */
    .speech-bubble {
      position: absolute;
      top: -45px;
      right: -20px;
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      color: #0288d1;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      border: 2px solid #81d4fa;
      animation: float 2s ease-in-out infinite alternate;
      z-index: 10;
      font-size: 0.9rem;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 20px;
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
    }

    /* Badan Kalkulator 3D */
    .calculator {
      position: relative;
      background: linear-gradient(145deg, #29b6f6, #0288d1);
      padding: 24px 20px 20px;
      border-radius: 28px;
      box-shadow: 0 20px 35px rgba(2, 136, 209, 0.3),
                  inset 0 4px 6px rgba(255, 255, 255, 0.4),
                  inset 0 -4px 6px rgba(0, 0, 0, 0.2);
      width: 310px;
      border: 4px solid #b3e5fc;
      z-index: 2;
    }

    /* Animasi Shaking saat tombol diklik */
    .calculator.shake {
      animation: shake 0.25s ease-in-out;
    }

    /* Wajah & Layar */
    .face-screen {
      background: #ffffff;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 20px;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .eyes {
      display: flex;
      gap: 16px;
      margin-bottom: 4px;
    }

    .eye {
      width: 14px;
      height: 18px;
      background: #263238;
      border-radius: 50%;
      position: relative;
    }

    .eye::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 5px;
      height: 5px;
      background: white;
      border-radius: 50%;
    }

    .mouth {
      width: 18px;
      height: 8px;
      border-bottom: 3px solid #263238;
      border-radius: 0 0 10px 10px;
      margin-bottom: 6px;
    }

    #display {
      width: 100%;
      height: 40px;
      font-size: 1.6rem;
      text-align: right;
      padding: 5px 10px;
      border: none;
      background: #e1f5fe;
      border-radius: 8px;
      color: #01579b;
      font-weight: bold;
      outline: none;
    }

    /* Grid Tombol 3D */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      padding: 14px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      background: linear-gradient(145deg, #ffffff, #e6e6e6);
      color: #37474f;
      box-shadow: 0 5px 0 #b0bec5, 0 8px 10px rgba(0,0,0,0.15);
      transition: all 0.1s ease;
      position: relative;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #b0bec5, 0 3px 6px rgba(0,0,0,0.15);
    }

    .btn-operator {
      background: linear-gradient(145deg, #81d4fa, #4fc3f7);
      color: #01579b;
      box-shadow: 0 5px 0 #29b6f6, 0 8px 10px rgba(0,0,0,0.15);
    }

    .btn-action {
      background: linear-gradient(145deg, #ff8a80, #ff5252);
      color: white;
      box-shadow: 0 5px 0 #d50000, 0 8px 10px rgba(0,0,0,0.15);
    }

    .btn-equal {
      background: linear-gradient(145deg, #a7ffeb, #64ffda);
      color: #004d40;
      box-shadow: 0 5px 0 #1de9b6, 0 8px 10px rgba(0,0,0,0.15);
    }

    /* Tangan & Animasi Melambai */
    .hand {
      position: absolute;
      top: 80px;
      width: 40px;
      height: 40px;
      background: #ff5252;
      border-radius: 50%;
      border: 3px solid #d50000;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1;
    }

    .hand-left {
      left: -25px;
    }

    .hand-right {
      right: -25px;
      animation: wave 1s infinite alternate ease-in-out;
      transform-origin: bottom left;
    }

    /* Kaki */
    .feet {
      display: flex;
      gap: 40px;
      margin-top: -10px;
      z-index: 1;
    }

    .foot {
      width: 45px;
      height: 20px;
      background: #263238;
      border-radius: 15px 15px 5px 5px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    /* Partikel Manik-Manik */
    .sparkle {
      position: fixed;
      pointer-events: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: pop 0.6s cubic-bezier(0, .9, .57, 1) forwards;
      z-index: 999;
    }

    /* Keyframes Animasi */
    @keyframes wave {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(25deg) translateY(-8px); }
    }

    @keyframes float {
      0% { transform: translateY(0); }
      100% { transform: translateY(-6px); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px) rotate(-1deg); }
      40% { transform: translateX(6px) rotate(1deg); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    @keyframes pop {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0.3);
      }
    }
  </style>
</head>
<body>

  <div class="character-container">
    <div class="speech-bubble">Hello! 👋</div>

    <div class="hand hand-left"></div>
    <div class="hand hand-right"></div>

    <div class="calculator" id="calculator">
      <div class="face-screen">
        <div class="eyes">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
        <div class="mouth"></div>
        <input type="text" id="display" readonly placeholder="0">
      </div>

      <div class="buttons">
        <button onclick="handlePress(event, 'C')" class="btn-action">C</button>
        <button onclick="handlePress(event, 'DEL')" class="btn-action">DEL</button>
        <button onclick="handlePress(event, '%')" class="btn-operator">%</button>
        <button onclick="handlePress(event, '/')" class="btn-operator">/</button>

        <button onclick="handlePress(event, '7')">7</button>
        <button onclick="handlePress(event, '8')">8</button>
        <button onclick="handlePress(event, '9')">9</button>
        <button onclick="handlePress(event, '*')" class="btn-operator">×</button>

        <button onclick="handlePress(event, '4')">4</button>
        <button onclick="handlePress(event, '5')">5</button>
        <button onclick="handlePress(event, '6')">6</button>
        <button onclick="handlePress(event, '-')" class="btn-operator">-</button>

        <button onclick="handlePress(event, '1')">1</button>
        <button onclick="handlePress(event, '2')">2</button>
        <button onclick="handlePress(event, '3')">3</button>
        <button onclick="handlePress(event, '+')" class="btn-operator">+</button>

        <button onclick="handlePress(event, '0')">0</button>
        <button onclick="handlePress(event, '.')">.</button>
        <button onclick="handlePress(event, '=')" class="btn-equal" style="grid-column: span 2;">=</button>
      </div>
    </div>

    <div class="feet">
      <div class="foot"></div>
      <div class="foot"></div>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    const calculator = document.getElementById('calculator');

    // Fungsi Gabungan ketika tombol ditekan
    function handlePress(event, val) {
      triggerEffects(event);
      
      if (val === 'C') {
        clearDisplay();
      } else if (val === 'DEL') {
        deleteLast();
      } else if (val === '=') {
        calculate();
      } else {
        appendValue(val);
      }
    }

    function appendValue(value) {
      if (display.value === '0' && value !== '.') {
        display.value = value;
      } else {
        display.value += value;
      }
    }

    function clearDisplay() {
      display.value = '';
    }

    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }

    function calculate() {
      try {
        if (display.value.trim() !== '') {
          // Mengganti simbol visual menjadi operator matematika valid
          let expression = display.value.replace(/×/g, '*');
          display.value = eval(expression);
        }
      } catch (error) {
        display.value = 'Error';
        setTimeout(() => clearDisplay(), 1500);
      }
    }

    // Efek Shaking & Manik-manik Percikan
    function triggerEffects(e) {
      // 1. Shaking kalkulator
      calculator.classList.remove('shake');
      void calculator.offsetWidth; // Trigger reflow
      calculator.classList.add('shake');

      // 2. Efek percikan manik-manik (Sparkles)
      const rect = e.target.getBoundingClientRect();
      const clickX = rect.left + rect.width / 2;
      const clickY = rect.top + rect.height / 2;

      const colors = ['#ff4081', '#ffd700', '#00e676', '#00b0ff', '#ff9100', '#e040fb'];

      for (let i = 0; i < 12; i++) {
        const sparkle = document.createElement('div');
        sparkle.classList.add('sparkle');
        sparkle.style.left = `${clickX}px`;
        sparkle.style.top = `${clickY}px`;
        sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

        // Random arah percikan
        const angle = Math.random() * Math.PI * 2;
        const velocity = 40 + Math.random() * 60;
        const tx = Math.cos(angle) * velocity;
        const ty = Math.sin(angle) * velocity;

        sparkle.style.setProperty('--tx', `${tx}px`);
        sparkle.style.setProperty('--ty', `${ty}px`);

        document.body.appendChild(sparkle);

        // Hapus elemen partikel setelah animasi selesai
        setTimeout(() => sparkle.remove(), 600);
      }
    }
  </script>
</body>
  </html>
